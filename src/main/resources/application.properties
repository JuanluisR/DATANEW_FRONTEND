# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_datanew}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Jackson - serializar fechas como strings ISO
spring.jackson.serialization.write-dates-as-timestamps=false

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Alert Notification Settings
alert.notification.cooldown-minutes=${ALERT_COOLDOWN_MINUTES:15}

# Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
alert.notification.from-email=${MAIL_USERNAME:noreply@datanew.com}
alert.notification.from-name=DataNew Weather
