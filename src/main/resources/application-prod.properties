# Production Configuration
# This file contains settings for production environment only

# Database Configuration - Production (use environment variables)
# DB_URL, DB_USERNAME, DB_PASSWORD should be set as environment variables

# JPA/Hibernate Configuration - Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - Production
logging.level.org.hibernate.SQL=warn
logging.level.com.datanew.datanew=info

# Server Configuration - Production
server.port=${SERVER_PORT:8080}
